# PitchPortal data refresh.
#
# UPLOAD NOTE: GitHub's web uploader can't create dot-folders, so this file
# ships as WORKFLOW-refresh.yml at the repo root. After uploading everything,
# recreate it at the real path:
#   repo ‚Üí Add file ‚Üí Create new file ‚Üí name it exactly:
#       .github/workflows/refresh.yml
#   ‚Üí paste this whole file in ‚Üí Commit. Then this copy can be deleted.
#
# What it does: every 6 hours, re-pulls Baseball Savant and the YouTube feeds
# (both pure-stdlib Python ‚Äî nothing to install), and commits the fresh JSON.
# The app reads these files via raw.githubusercontent.com, so a commit here IS
# the deploy. The season is computed from the calendar inside the ingest, so
# this keeps working in 2027 without anyone touching it.
# ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
name: Refresh data

on:
  schedule:
    - cron: '17 2,8,14,20 * * *'   # every 6h, offset to dodge top-of-hour load
  workflow_dispatch: {}             # the "Run workflow" button, for manual runs

permissions:
  contents: write                   # allows the commit below; no PAT needed

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild pitching leaderboards
        run: python -m pitchportal_ingest.pitching

      - name: Rebuild single-pitch extremes (incremental; first run backfills the season)
        run: python -m pitchportal_ingest.extremes || echo "extremes refresh failed; keeping previous"

      - name: Rebuild community feed
        # The feed must not kill the run if YouTube hiccups ‚Äî stale feed rows
        # are fine for six hours, a failed workflow stops the pitching data too.
        run: python -m pitchportal_ingest.feed || echo "feed refresh failed; keeping previous"

      - name: Commit if anything changed
        run: |
          git config user.name "pitchportal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cache/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data refresh $(date -u +'%Y-%m-%d %H:%M')"
          git push
